name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
        env:
          # Public token baked into the HTML, so a variable rather than a secret. See README.
          VITE_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - run: pnpm check-build
      # `cf build` は Waku を検出して素の `waku build` を走らせてしまう(フォント・OG生成や
      # HTML最適化を含む `pnpm build` を通らない)ので、ビルド済みの dist/public を
      # wrangler バンドラー(cf のデリゲート)で Build Output にしてから --prebuilt で上げる
      - run: pnpm exec cf-wrangler build
      - run: pnpm exec cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
