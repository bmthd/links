name: Diag prod
on:
  push:
    branches: [diag/prod-check]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: curl -sSI https://links.bmth.dev/ ; curl -sSI https://links.bmth.dev/en
      - run: curl -sS https://links.bmth.dev/ | head -c 1500; echo; curl -sS https://links.bmth.dev/ | grep -o 'import("[^"]*")[^,;]\{0,80\}'
      - run: |
          npm i --no-save playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node .github/diag/check.cjs
