name: Diag prod
on:
  push:
    branches: [diag/prod-check]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: curl -sSI https://links.bmth.dev/ ; curl -sSI https://links.bmth.dev/en
      - run: curl -sS https://links.bmth.dev/ | head -c 1500; echo; curl -sS https://links.bmth.dev/ | grep -o 'import("[^"]*")[^,;]\{0,80\}'
      - run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null
          npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node "$GITHUB_WORKSPACE/.github/diag/check.cjs"
